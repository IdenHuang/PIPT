openapi: 3.0.0
servers: []
info:
  title: AI Learning Assistant API
  description: This API intended to deploy on aws API Gateway
  version: "1.0.0"
tags:
  - name: Student
    description: endpoints accessible by students
  - name: Instructor
    description: endpoints accessible by instructors
  - name: Admin
    description: endpoints accessible by admins
x-amazon-apigateway-request-validators:
  all:
    validateRequestParameters: true
    validateRequestBody: true
  params-only:
    validateRequestParameters: true
    validateRequestBody: false
x-amazon-apigateway-request-validator: params-only
# Gateway error responses return fixed messages rather than
# $context.error.messageString, so internal error/validator details are not
# echoed to callers. The frontend only branches on the HTTP status.
# Access-Control-Allow-Origin stays '*' on these errors and on the OPTIONS
# mocks: API Gateway gateway responses and mock integrations cannot select one
# origin from a list, the API authenticates with a bearer token (never cookies,
# so '*' never permits credentialed reads), and the Lambda responses that carry
# data use the ALLOWED_ORIGINS allowlist.
x-amazon-apigateway-gateway-responses:
  UNAUTHORIZED:
    statusCode: "401"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Unauthorized"}
  BAD_REQUEST_PARAMETERS:
    statusCode: "400"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Invalid request parameters"}
  BAD_REQUEST_BODY:
    statusCode: "400"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Invalid request body"}
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Request rejected"}
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Internal server error"}
  THROTTLED:
    statusCode: "429"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Rate limit exceeded. Please retry after a brief wait."}
  REQUEST_TOO_LARGE:
    statusCode: "413"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    responseTemplates:
      application/json: |
        {"message":"Request payload is too large."}
x-common-options: &commonOptions
  options:
    summary: CORS support
    description: |
      Enable CORS by returning correct headers
    responses:
      200:
        $ref: "#/components/responses/Success"
    x-amazon-apigateway-integration:
      type: mock
      requestTemplates:
        application/json: |
          {
            "statusCode" : 200
          }
      responses:
        default:
          statusCode: "200"
          responseParameters:
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
            method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
            method.response.header.Access-Control-Allow-Origin: "'*'"
          responseTemplates:
            application/json: |
              {}
paths:
  /student/text_generation:
    <<: *commonOptions
    post:
      tags:
        - Student
      summary: Generate a response from the LLM
      operationId: student_text_generation_POST
      parameters:
        - in: query
          name: simulation_group_id
          required: true
          description: ID of the group
          schema:
            type: string
        - in: query
          name: session_id
          required: true
          description: ID of the session since multiple sessions can exist within a table
          schema:
            type: string
        - in: query
          name: patient_id
          required: true
          description: ID of the patient used to find the patient name which becomes the conversation's label
          schema:
            type: string
        - in: query
          name: session_name
          required: false
          description: Name of the session passed from the front-end after it has been created by the LLM
          schema:
            type: string
        - in: query
          name: stream
          required: false
          description: Enable streaming response
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
        - in: header
          name: X-Stream-Nonce
          required: false
          description: >
            Server-to-server only. Per-request nonce minted by the socket server when stream=true;
            the Lambda echoes it on every /stream-callback POST so the socket server relays only into
            the session it registered. Values that aren't 64 lowercase hex chars are not forwarded.
          schema:
            type: string
        - in: query
          name: mode
          required: false
          description: >
            Operation mode for the text generation endpoint.
            "chat" (default) generates a conversational response,
            "debrief" generates a post-session debrief evaluation,
            "match" performs question matching,
            "test_debrief" generates a debrief using a prompt provided in the request body without persisting results,
            "test_system_prompt" runs a Prompt Playground chat turn using the system_prompt (and optional
            patient_prompt) from the request body without persisting messages.
            test_debrief and test_system_prompt are restricted to instructors of the simulation group and
            admins; the Lambda enforces this (cdk/text_generation/src/helpers/authz.py). For
            test_system_prompt, session_id must be a playground scratch ID matching ^test-[A-Za-z0-9-]{1,64}$.
          schema:
            type: string
            enum: ["chat", "debrief", "match", "test_debrief", "test_system_prompt"]
            default: "chat"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message_content:
                  type: string
                  description: >
                    Content of the student's message (used when mode=chat or mode=test_system_prompt).
                    For mode=test_system_prompt, omit or leave empty to start the playground conversation.
                system_prompt:
                  type: string
                  description: >
                    Instructor-authored system prompt to test. Used only when mode=test_system_prompt;
                    falls back to the default system prompt when empty.
                patient_prompt:
                  type: string
                  description: >
                    Optional patient prompt override. Used only when mode=test_system_prompt;
                    falls back to the persona's stored prompt when empty.
                debrief_prompt:
                  type: string
                  description: >
                    The debrief prompt text to use for test debrief generation.
                    Required when mode=test_debrief. The endpoint will use this prompt
                    instead of the database-stored prompt to generate the debrief evaluation.
      responses:
        "200":
          description: >
            Response varies by mode. For mode=chat and mode=test_system_prompt, returns the LLM response.
            For mode=test_debrief, returns the debrief evaluation result.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: ChatResponse
                    description: Response for mode=chat
                    properties:
                      session_name:
                        type: string
                        description: Name of the session which becomes the conversation's label
                      llm_output:
                        type: string
                        description: Response generated by the LLM
                      llm_verdict:
                        type: string
                        description: Judgement of the LLM whether the student has diagnosed the patient correctly
                  - type: object
                    title: TestDebriefResponse
                    description: Response for mode=test_debrief
                    properties:
                      summary:
                        type: string
                        description: Overall interview summary
                      questions_addressed:
                        type: array
                        description: List of questions that were addressed during the session
                        items:
                          type: object
                          properties:
                            question_id:
                              type: string
                            question_text:
                              type: string
                            matched_messages:
                              type: array
                              items:
                                type: object
                                properties:
                                  message_content:
                                    type: string
                                  similarity_score:
                                    type: number
                                  confidence_tier:
                                    type: string
                            quality_assessment:
                              type: string
                      questions_missed:
                        type: array
                        description: List of questions that were not addressed
                        items:
                          type: object
                          properties:
                            question_id:
                              type: string
                            question_text:
                              type: string
                            is_mandatory:
                              type: boolean
                            weight:
                              type: number
                      recommendation_feedback:
                        type: object
                        description: Strengths and areas for improvement
                        properties:
                          strengths:
                            type: array
                            items:
                              type: string
                          areas_for_improvement:
                            type: array
                            items:
                              type: string
                      reasoning_gaps:
                        type: string
                        description: Identified gaps in the student's reasoning
                      overall_score:
                        type: number
                        description: Numeric score for the overall session performance
                      suggested_rewrites:
                        type: array
                        description: Suggested message rewrites for better question coverage
                        items:
                          type: object
                          properties:
                            original_message:
                              type: string
                            matched_question_id:
                              type: string
                            similarity_score:
                              type: number
                            suggested_rewrite:
                              type: string
                      answer_key_comparison:
                        type: object
                        description: Comparison against the answer key if available
                        properties:
                          answer_key_available:
                            type: boolean
                          correct_elements:
                            type: array
                            items:
                              type: string
                          missing_elements:
                            type: array
                            items:
                              type: string
                          incorrect_elements:
                            type: array
                            items:
                              type: string
                          overall_alignment:
                            type: string
                      recommendation:
                        type: string
                        description: Overall recommendation for the student
            text/event-stream:
              schema:
                type: string
                description: Server-sent events stream for real-time response
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - studentAuthorizer: []
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TextGenLambdaDockerFuncLiveAlias}/invocations"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "aws_proxy"
  /student/delete_last_message:
    <<: *commonOptions
