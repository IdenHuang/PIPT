  /instructor/ingestion_status:
    <<: *commonOptions
    get:
      tags:
        - Instructor
      summary: Get the ingestion_status of LLM files for specific patient in simulation group
      operationId: instructor_ingestion_status_GET
      parameters:
        - in: query
          name: simulation_group_id
          required: true
          schema:
            type: string
          description: ID of the group
        - in: query
          name: persona_id
          required: true
          schema:
            type: string
          description: ID of the patient (persona)
      responses:
        "200":
          description: Successfully retrieved ingestion_status of uploaded files for specific patient in simulation group
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Top-level keys are documents-folder filenames (flat map, kept
                  for backward compatibility). The 'byFolder' object groups
                  status by folder so filenames cannot collide across sections.
                properties:
                  byFolder:
                    type: object
                    properties:
                      documents:
                        type: object
                        additionalProperties:
                          type: string
                      info:
                        type: object
                        additionalProperties:
                          type: string
                      answer_key:
                        type: object
                        additionalProperties:
                          type: string
                additionalProperties:
                  type: string
                  description: Map containing documents-folder filenames as keys and ingestion_status as values.
                example:
                  "Patient_Record_1.pdf": "processing"
                  byFolder:
                    documents:
                      "Patient_Record_1.pdf": "processing"
                      "Patient_Record_2.pdf": "completed"
                    info:
                      "History.pdf": "completed"
                    answer_key: {}
        "400":
          description: Bad Request - Missing query parameters
        "500":
          description: Internal Server Error
      security:
        - instructorAuthorizer: []
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${instructorFunction.Arn}/invocations"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
